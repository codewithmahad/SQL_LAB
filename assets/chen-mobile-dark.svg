<svg xmlns="http://www.w3.org/2000/svg" width="480" height="630" viewBox="0 0 480 630" role="img" aria-labelledby="title desc">
<title id="title">SQL lab / Chen study</title>
<desc id="desc">Personal lab study in Chen notation. Topic and Exercise are rectangular entities, joined by a contains relationship diamond with one-to-many cardinality. Exercise has total participation, shown by a double line: each exercise belongs to a topic. Each entity has an oval title attribute and an underlined identifier attribute, topic_id or exercise_id. This is a modelling study, not an implemented database schema.</desc>
