<svg xmlns="http://www.w3.org/2000/svg" width="480" height="510" viewBox="0 0 480 510" role="img" aria-labelledby="title desc">
<title id="title">SQL lab / EER study</title>
<desc id="desc">Enhanced conceptual model of lab work. WorkItem has an underlined work_id identifier and a title attribute. It specializes into SQLNote and DesignNote. The circle marked o denotes overlapping membership: one item may be both types. The single line from WorkItem denotes partial specialization: an item may be neither. Both subtypes inherit WorkItem attributes. This is a modelling study, not an implemented database schema.</desc>
