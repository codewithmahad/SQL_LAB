<svg xmlns="http://www.w3.org/2000/svg" width="480" height="555" viewBox="0 0 480 555" role="img" aria-labelledby="title desc">
<title id="title">SQL lab / logical model</title>
<desc id="desc">Logical view of the same lab model. Topic has primary key topic_id and title. Exercise has primary key exercise_id, foreign key topic_id, and title. Each Exercise belongs to exactly one Topic; a Topic can have zero or many Exercises. The dashed non-identifying relationship leaves exercise_id as an independent primary key. This is a modelling study, not an implemented database schema.</desc>
